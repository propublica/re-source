[project]
name = "re-source"
version = "0.1.0"
description = "Semantic and keyword search over tip and form submissions."
requires-python = ">=3.12"
license = { text = "MIT" }
# Dependencies move here from the repo root in the next commit, when the
# source tree does. Nothing vendor-specific may ever be listed here --
# tests/test_no_heavy_deps.py enforces that from the other direction.
dependencies = [
    "duckdb>=0.10.0",
    "httpx>=0.27.0",
    "langfuse>=3.14.5",
    "numpy>=1.24.0",
    "ollama>=0.6.1",
    "pandas>=2.0.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # The branding CSS targets Streamlit's rendered DOM. Upgrade deliberately
    # with a visual regression pass rather than allowing container builds to
    # resolve a new frontend independently of the tested application.
    "streamlit==1.58.0",
    "tabulate>=0.9.0",
    "pyvespa>=1.2.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "authlib>=1.7.2",
    "joserfc>=1.7.3",
    "tokenizers>=0.23.1",
    "boto3>=1.43.91",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["re_source"]
